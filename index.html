<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Читать в своём темпе</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
<section><h1>Читать в своём темпе</h1><p>Посчитайте, сколько страниц брать на день, чтобы дочитать книгу к сроку.</p></section>
<form><label>Осталось страниц<input name="pages" type="number" min="1" max="100000" value="240" required></label><label>Дней до срока<input name="days" type="number" min="1" max="100000" value="14" required></label><button>Рассчитать</button><output aria-live="polite">Введите значения</output></form>
</main>
</body>
</html>
